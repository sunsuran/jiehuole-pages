<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文操作手册 — 穿越到异世界做霸主</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#1a120a 0%,#0d0805 100%);
  color:#e8d8b5;min-height:100vh;padding:24px 16px;line-height:1.7}
.langbar{position:fixed;top:14px;right:14px;z-index:10}
.langbtn{border:1px solid rgba(212,175,55,.5);background:rgba(0,0,0,.4);
  color:#e8d8b5;padding:5px 12px;margin-left:4px;border-radius:6px;cursor:pointer;font-size:12px}
.langbtn.active{background:linear-gradient(180deg,#e8b93a,#a97c14);
  color:#1a120a;font-weight:bold;border-color:#ffd766}
.wrap{max-width:1000px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar h1{margin:0;font-size:20px;line-height:1.3;
  background:linear-gradient(180deg,#fff6d8 0%,#ffd766 55%,#e0a92c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bar a{margin-left:auto;color:#ffd766;text-decoration:none;font-size:13px;
  border:1px solid rgba(212,175,55,.45);padding:6px 14px;border-radius:8px;
  background:linear-gradient(120deg,rgba(212,175,55,.12),rgba(212,175,55,.04))}
.bar a:hover{border-color:#e8b93a;background:linear-gradient(120deg,rgba(212,175,55,.22),rgba(212,175,55,.08))}
.frame{width:100%;height:82vh;border:1px solid rgba(212,175,55,.5);
  border-radius:14px;background:#fff;display:block;
  box-shadow:0 18px 60px rgba(0,0,0,.7),0 0 30px rgba(212,175,55,.18)}
.fallback{text-align:center;margin-top:14px;font-size:13px;color:#a89e8e}
.fallback a{color:#ffd766}
</style>
</head>
<body onload="setLang('zh')">

<div class="langbar">
  <button class="langbtn" id="btn-en" onclick="setLang('en')">English</button>
  <button class="langbtn" id="btn-zh" onclick="setLang('zh')">中文</button>
</div>

<!-- ================= ENGLISH ================= -->
<div id="en" class="wrap">
  <div class="bar">
    <h1>Game Manual</h1>
    <a href="index.html">← Home</a>
  </div>
  <iframe class="frame" src="用户操作手册.pdf" title="Game Manual PDF"></iframe>
  <p class="fallback">Can't see the manual? <a href="用户操作手册.pdf" download>Download the PDF</a>.</p>
</div>

<!-- ================= 中文 ================= -->
<div id="zh" class="wrap" style="display:none">
  <div class="bar">
    <h1>中文操作手册</h1>
    <a href="index.html">← 返回首页</a>
  </div>
  <iframe class="frame" src="用户操作手册.pdf" title="中文操作手册 PDF"></iframe>
  <p class="fallback">无法显示手册？<a href="用户操作手册.pdf" download>点击下载 PDF</a>。</p>
</div>

<script>
function setLang(l){
  document.getElementById('en').style.display = (l==='en')?'block':'none';
  document.getElementById('zh').style.display = (l==='zh')?'block':'none';
  document.getElementById('btn-en').className = 'langbtn' + (l==='en'?' active':'');
  document.getElementById('btn-zh').className = 'langbtn' + (l==='zh'?' active':'');
  document.documentElement.lang = l;
  document.title = (l==='en')
    ? 'Game Manual — I Transmigrated to Another World to Become the Overlord'
    : '中文操作手册 — 穿越到异世界做霸主';
}
</script>
</body>
</html>
